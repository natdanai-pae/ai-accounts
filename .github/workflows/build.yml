name: Build desktop downloads
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.2'
          cache: false
      - name: Install pinned build tools
        run: python -m pip install pyinstaller==6.22.3 cryptography==50.0.2 mcp==2.3.0
      - name: Build and smoke test Windows app
        shell: pwsh
        run: ./build-windows.ps1
      - name: Verify source and packaged MCP with official client
        shell: pwsh
        run: |
          python mcp_client_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Source MCP acceptance failed' }
          $unpack = Join-Path $env:RUNNER_TEMP 'mcp-package'
          Expand-Archive -LiteralPath dist/AI-Accounts-0.3.0-windows-x64.zip -DestinationPath $unpack
          python mcp_client_smoke.py --helper "$unpack/AI Accounts/backend/aiaccounts-helper.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged MCP acceptance failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64
          path: |
            dist/AI-Accounts-0.3.0-windows-x64.zip
            dist/SHA256SUMS-windows
          if-no-files-found: error
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.2'
          cache: false
      - name: Install pinned build tools
        run: python -m pip install pyinstaller==6.22.3 cryptography==50.0.2 mcp==2.3.0
      - name: Test macOS source
        run: python -m unittest discover -p 'tests_*.py'
      - name: Build macOS app
        run: AI_ACCOUNTS_BUILD_PYTHON="$(command -v python)" bash package-release.sh
      - name: Verify source and packaged MCP with official client
        run: |
          python mcp_client_smoke.py
          ditto -x -k dist/AI-Accounts-0.3.0-macos-arm64.zip "$RUNNER_TEMP/mcp-package"
          python mcp_client_smoke.py --helper "$RUNNER_TEMP/mcp-package/AI Accounts.app/Contents/Resources/backend/aiaccounts-helper"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS
          if-no-files-found: error
